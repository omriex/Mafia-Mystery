<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Mystery</title>
    <link rel="icon" type="image/png" href="assets/player.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loading-screen">
    <img src="assets/player.png" style="width: 128px; height: 128px; margin-bottom: 20px; image-rendering: pixelated;">
    <div style="font-size: 32px; margin-bottom: 10px;">Mafia Mystery</div>
    <div id="loading-text" style="font-size: 16px; color: #888;">LOADING ASSETS...</div>
</div>

<div id="main-menu-ui">
    <img src="assets/player.png" style="width: 96px; height: 96px; margin-bottom: 10px; image-rendering: pixelated;">
    <div style="font-size: 40px; margin-bottom: 25px; color: white; font-weight: bold; text-shadow: 0px 4px 6px rgba(0,0,0,0.5);">Mafia Mystery</div>
    <input type="text" id="username-input" maxlength="16" placeholder="Nickname" autocomplete="off">
    <button id="play-btn">PLAY</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="editor-ui" style="display: none;">
    <button id="editor-toggle-btn" class="layer-btn" style="width: 190px;">Editor: OFF</button>
    <div id="editor-tools" style="display: none; flex-direction: column; gap: 10px;">
        <div id="layer-toggles">
            <button class="layer-btn active" data-layer="background">Floor</button>
            <button class="layer-btn" data-layer="floor2">Floor 2</button>
            <button class="layer-btn" data-layer="walls">Wall</button>
            <button class="layer-btn" data-layer="trees">Tree</button>
        </div>
        <div id="palette"></div>
    </div>
</div>

<div id="leaderboard-ui" style="display: none;">
    <div id="leaderboard-header">
        <span>LEADERBOARD</span>
        <span id="leaderboard-toggle">▼</span>
    </div>
    <div id="leaderboard-list">
        <div class="leaderboard-entry">
            <span style="color: #ffffff;">player</span>
        </div>
    </div>
</div>

<div id="bottom-ui" style="display: none;">
    <div id="inventory-ui">
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
    </div>
    <div id="health-bar-bg">
        <div id="health-bar-fill"></div>
    </div>
</div>

<div id="tooltip-ui">
    <div id="tooltip-header"></div>
</div>

<div id="chat-ui">
    <input type="text" id="chat-input" maxlength="80" placeholder="Chat" autocomplete="off">
</div>

<!-- Mafia owner control panel — shown to owner in lobby -->
<div id="mafia-owner-panel" style="display:none;
    position:fixed;bottom:110px;left:10px;
    background:rgba(0,0,0,0.88);border:2px solid rgba(255,255,255,0.15);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    z-index:2000;padding:12px 16px;min-width:200px;">
    <div style="font-size:12px;letter-spacing:2px;color:#888;margin-bottom:10px;">MAFIA CONTROLS</div>
    <button id="mafia-start-btn"
        style="background:#ff8800;color:white;border:none;padding:10px 24px;
               font-size:14px;font-weight:bold;cursor:pointer;width:100%;
               font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin-bottom:6px;
               opacity:0.5;">
        START GAME
    </button>
    <div id="mafia-lobby-status" style="font-size:12px;color:#888;">0/6 players</div>
</div>

<script src="client.js"></script>

<script>
// Wire up start button after DOM + client.js are ready
window.addEventListener('load', () => {
    document.getElementById('mafia-start-btn').addEventListener('click', () => {
        if (window.ws && window.ws.readyState === WebSocket.OPEN) {
            window.ws.send(JSON.stringify({ type: 'mafia_start' }));
        }
    });
});

// Show owner panel when init arrives and isOwner — client.js sets isOwner
// We hook into the existing isOwner path via a MutationObserver on editor-ui visibility
const _ownerObs = new MutationObserver(() => {
    const editorUI = document.getElementById('editor-ui');
    if (editorUI && editorUI.style.display !== 'none') {
        document.getElementById('mafia-owner-panel').style.display = 'block';
    }
});
_ownerObs.observe(document.getElementById('editor-ui'), { attributes: true, attributeFilter: ['style'] });
</script>
</body>
</html>
